name: Unit
on:
  workflow_call:
env:
  LINGO_DOT_DEV_API_KEY: ${{ secrets.CI_LINGO_DOT_DEV_API_KEY }}
permissions:
  contents: read
jobs:
  test:
    name: Unit
    timeout-minutes: 20
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/cache-checkout
      - uses: ./.github/actions/yarn-install
      - run: yarn prisma generate
      - name: Run unit tests with coverage
        run: yarn test:coverage:ci -- --no-isolate
      - name: Publish coverage summary
        if: always()
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const summaryPath = "coverage/coverage-summary.json";
          if (!fs.existsSync(summaryPath)) {
            console.log("Coverage summary not found, skipping report publication.");
            process.exit(0);
          }

          const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8")).total;
          const metrics = ["lines", "statements", "functions", "branches"];
          const lines = [
            "## Unit Test Coverage",
            "",
            "| Metric | Covered | Total | Percent | Threshold |",
            "| --- | ---: | ---: | ---: | ---: |",
            ...metrics.map((metric) => {
              const entry = summary[metric];
              return `| ${metric} | ${entry.covered} | ${entry.total} | ${entry.pct}% | 80% |`;
            }),
          ];

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          EOF
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 30
      # We could add different timezones here that we need to run our tests in
      - run: TZ=America/Los_Angeles VITEST_MODE=timezone yarn test -- --no-isolate
